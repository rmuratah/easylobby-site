name: Publicar site

on:
  push:
    branches: [main]
  # Uma release publicada muda o link do botão Baixar.
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - name: Link do instalador mais novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases/latest" \
            --jq '[.assets[] | select(.name | endswith("-setup.exe"))][0].browser_download_url // empty' || true)
          echo "Instalador: ${url:-nenhum, o botão abre a página de releases}"
          echo "VITE_INSTALLER_URL=$url" >> "$GITHUB_ENV"
      - name: Build
        run: bun run build
        env:
          # Servido na raiz de easylobby.com.br. Sem o domínio, defina a variável
          # BASE_PATH do repositório como /easylobby-site/.
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      - name: Página 404 e .nojekyll
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
